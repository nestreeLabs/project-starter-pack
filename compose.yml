services:
  app:
    # IMAGE пишет CI в .env на сервере (ghcr.io/<owner>/<repo>:<sha>), локально собирается app
    image: ${IMAGE:-app}
    build: .
    ports:
      - "${HOST_PORT:-80}:4321"
    env_file:
      - path: .env
        required: false
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:4321/api/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
