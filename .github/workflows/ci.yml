name: CI/CD

on:
  pull_request:
  push:
    branches: [main]
  # деплой: Run workflow с main = последняя версия, с тега (Use workflow from → Tags) = эта версия
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run check

  build:
    needs: test
    runs-on: ubuntu-latest
    # релизы с main идут по очереди, чтобы два запуска не посчитали одну версию
    concurrency: build-${{ github.ref }}
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      # ghcr принимает только нижний регистр
      - id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      # версия по Conventional Commits с прошлого тега: ! или BREAKING CHANGE → major, feat → minor, fix/perf → patch.
      # Остальные типы (docs, ci, chore...) релиз не создают. Пустая версия = только сборка
      - id: version
        if: github.event_name == 'push'
        run: |
          last=$(git describe --tags --abbrev=0 --match 'v*' 2>/dev/null || true)
          log=$(git log --format='%s%n%b' "${last:+$last..}HEAD")
          if grep -qE '^[a-z]+(\([^)]*\))?!:|^BREAKING CHANGE:' <<< "$log"; then bump=major
          elif grep -qE '^feat(\([^)]*\))?:' <<< "$log"; then bump=minor
          elif grep -qE '^(fix|perf)(\([^)]*\))?:' <<< "$log"; then bump=patch
          fi
          if [[ -n "${bump:-}" ]]; then
            IFS=. read -r major minor patch <<< "${last:-v0.0.0}"
            major=${major#v}
            case "$bump" in
              major) v="v$((major + 1)).0.0" ;;
              minor) v="v$major.$((minor + 1)).0" ;;
              patch) v="v$major.$minor.$((patch + 1))" ;;
            esac
          fi
          echo "version=${v:-}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - if: steps.version.outputs.version != ''
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ steps.version.outputs.version != '' }}
          tags: |
            ${{ steps.image.outputs.name }}:${{ steps.version.outputs.version || 'dev' }}
            ${{ steps.image.outputs.name }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # тег ставится только после успешной публикации образа
      - if: steps.version.outputs.version != ''
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: git tag "$VERSION" && git push origin "$VERSION"

  deploy:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: production
    concurrency: deploy-production
    env:
      SSH_HOST: ${{ secrets.SSH_HOST }}
      SSH_PORT: ${{ secrets.SSH_PORT || '22' }}
      SSH_USER: ${{ secrets.SSH_USER }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # запуск с тега = эта версия (откат), с ветки = последняя выпущенная
      - name: Определить версию
        run: |
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            TAG="$GITHUB_REF_NAME"
          else
            TAG=$(git tag -l 'v*' --sort=-v:refname | head -1)
          fi
          [[ -n "$TAG" ]] || { echo "Нет ни одной версии v*, сначала нужен релиз"; exit 1; }
          echo "Деплой $TAG"
          echo "TAG=$TAG" >> "$GITHUB_ENV"

      - name: Настроить ssh
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519
          {
            echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}:$TAG"
            echo "DIR=/opt/site"
            echo "TARGET=$SSH_USER@$SSH_HOST"
          } >> "$GITHUB_ENV"

      - name: Выкатить
        env:
          APP_ENV: ${{ secrets.APP_ENV }}
        run: |
          scp -P "$SSH_PORT" compose.yml "$TARGET:$DIR/"
          # compose берёт IMAGE из .env для подстановки в image
          { printf '%s\n' "$APP_ENV"; echo "IMAGE=$IMAGE"; } \
            | ssh -p "$SSH_PORT" "$TARGET" "cat > $DIR/.env"
          ssh -p "$SSH_PORT" "$TARGET" "cd $DIR && docker compose pull && docker compose up -d"

      - name: Healthcheck
        run: |
          for i in $(seq 10); do
            curl -fsS "http://$SSH_HOST/api/health" && exit 0
            sleep 3
          done
          ssh -p "$SSH_PORT" "$TARGET" "cd $DIR && docker compose logs --tail 100"
          exit 1

      - name: Очистить старые образы
        run: ssh -p "$SSH_PORT" "$TARGET" "docker image prune -f"
