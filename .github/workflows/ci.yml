name: CI/CD

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: "sha образа для отката (пусто = собрать и выкатить текущий коммит)"
        required: false

permissions:
  contents: read

jobs:
  test:
    if: inputs.tag == ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run check

  build:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      # ghcr принимает только нижний регистр
      - id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - if: github.event_name == 'workflow_dispatch'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # на PR и push образ только собирается, публикуется при ручном запуске
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name == 'workflow_dispatch' }}
          tags: |
            ${{ steps.image.outputs.name }}:${{ github.sha }}
            ${{ steps.image.outputs.name }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    # при откате (tag задан) test и build пропущены, deploy всё равно идёт
    if: github.event_name == 'workflow_dispatch' && !cancelled() && !failure()
    runs-on: ubuntu-latest
    environment: production
    concurrency: deploy-production
    env:
      SSH_HOST: ${{ secrets.SSH_HOST }}
      SSH_PORT: ${{ secrets.SSH_PORT }}
      SSH_USER: ${{ secrets.SSH_USER }}
      TAG: ${{ inputs.tag || github.sha }}
    steps:
      - uses: actions/checkout@v5

      - name: Настроить ssh
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519
          {
            echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}:$TAG"
            echo "DIR=/opt/site"
            echo "TARGET=$SSH_USER@$SSH_HOST"
          } >> "$GITHUB_ENV"

      - name: Выкатить
        env:
          APP_ENV: ${{ secrets.APP_ENV }}
        run: |
          scp -P "$SSH_PORT" compose.yml "$TARGET:$DIR/"
          # compose берёт IMAGE из .env для подстановки в image
          { printf '%s\n' "$APP_ENV"; echo "IMAGE=$IMAGE"; } \
            | ssh -p "$SSH_PORT" "$TARGET" "cat > $DIR/.env"
          ssh -p "$SSH_PORT" "$TARGET" "cd $DIR && docker compose pull && docker compose up -d"

      - name: Healthcheck
        run: |
          for i in $(seq 10); do
            curl -fsS "http://$SSH_HOST/api/health" && exit 0
            sleep 3
          done
          ssh -p "$SSH_PORT" "$TARGET" "cd $DIR && docker compose logs --tail 100"
          exit 1

      - name: Очистить старые образы
        run: ssh -p "$SSH_PORT" "$TARGET" "docker image prune -f"
